name: Release

# Push a tag like v1.0.0: test, build MacroClic.exe, publish it as a Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt pyinstaller==6.22.3
      - run: python test_macroclic.py
      - run: >-
          python -m PyInstaller --onefile --windowed --name MacroClic
          --icon macroclic.ico --add-data "macroclic.ico;." --collect-data sv_ttk
          macroclic.py
      - run: gh release create "$env:GITHUB_REF_NAME" dist/MacroClic.exe --title "MacroClic $env:GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
